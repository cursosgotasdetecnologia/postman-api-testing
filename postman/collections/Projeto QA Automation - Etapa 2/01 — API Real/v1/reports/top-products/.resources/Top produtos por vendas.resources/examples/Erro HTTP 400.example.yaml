  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Valor de top inválido. Use 10, 20, 50 ou 100."
        ]
      }
order: 2000
