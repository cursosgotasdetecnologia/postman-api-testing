$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/reports/top-products"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "name": "Mouse Gamer RGB Pro",
            "sales_count": 284,
            "total_revenue": 85171.6
          },
          {
            "name": "Teclado Mecânico Wireless",
            "sales_count": 192,
            "total_revenue": 105598.08
          }
        ],
        "mensagens": []
      }
order: 1000
