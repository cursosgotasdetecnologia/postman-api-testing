$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/orders/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": 1,
          "order_number": "ORD-001",
          "status": "pending",
          "total_amount": 199.9,
          "items": [
            {
              "id": 1,
              "quantity": 1,
              "unit_price": 199.9,
              "subtotal": 199.9,
              "products": {
                "id": 1,
                "name": "Mouse Gamer",
                "sku": "MOUSE-001",
                "image_url": null
              }
            }
          ]
        },
        "mensagens": [
          "Operação realizada com sucesso."
        ]
      }
order: 1000
