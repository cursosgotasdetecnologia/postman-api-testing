$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/orders/:id/payments"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [],
        "mensagens": [
          "Nenhum pagamento encontrado para este pedido."
        ]
      }
order: 3000
