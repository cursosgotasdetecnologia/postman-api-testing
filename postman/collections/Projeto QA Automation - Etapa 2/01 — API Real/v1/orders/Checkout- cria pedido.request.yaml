$kind: http-request
name: "Checkout: cria pedido"
url: "{{projetoQAAutomationBaseUrl}}/api/v1/orders"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "product_id": 1,
          "quantity": 2,
          "unit_price": 299.9
        }
      ],
      "shipper_id": 1,
      "address_id": 5
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
settings: {}
examples: ./.resources/Checkout- cria pedido.resources/examples
order: 3000
