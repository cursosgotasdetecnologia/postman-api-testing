$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/orders"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": 1001,
            "order_number": "ORD-20240906-1001",
            "status": "delivered",
            "total_amount": 599.8,
            "shippers": {
              "company_name": "Correios SEDEX"
            }
          }
        ],
        "pagination": {
          "page": 1,
          "totalPages": 2,
          "total": 11
        },
        "mensagens": []
      }
order: 1000
