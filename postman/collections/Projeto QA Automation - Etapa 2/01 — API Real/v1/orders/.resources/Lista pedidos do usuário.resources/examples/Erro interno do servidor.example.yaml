$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/orders"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [],
        "pagination": {
          "page": 1,
          "limit": 10,
          "total": 0,
          "totalPages": 0
        },
        "mensagens": [
          "Erro ao buscar histórico de pedidos."
        ]
      }
order: 4000
