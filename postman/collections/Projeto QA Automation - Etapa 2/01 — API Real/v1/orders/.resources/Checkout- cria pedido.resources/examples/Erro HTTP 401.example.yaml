$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/orders"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "product_id": 1,
            "quantity": 2,
            "unit_price": 299.9
          }
        ],
        "shipper_id": 1,
        "address_id": 5
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "No token provided"
        ]
      }
order: 3000
