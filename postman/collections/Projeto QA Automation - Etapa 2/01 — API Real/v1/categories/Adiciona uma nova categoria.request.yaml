$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Eletrônicos",
      "description": "Produtos eletrônicos variados"
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
settings: {}
examples: ./.resources/Adiciona uma nova categoria.resources/examples
order: 3000
