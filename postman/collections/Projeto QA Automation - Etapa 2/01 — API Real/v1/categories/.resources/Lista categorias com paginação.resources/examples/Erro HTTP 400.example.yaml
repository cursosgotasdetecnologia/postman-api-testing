$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories?page=1&limit=1001"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      description: Número da página
    - key: limit
      value: "1001"
      description: Quantidade de itens por página
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Limite deve estar entre 1 e 1000."
        ]
      }
order: 2000
