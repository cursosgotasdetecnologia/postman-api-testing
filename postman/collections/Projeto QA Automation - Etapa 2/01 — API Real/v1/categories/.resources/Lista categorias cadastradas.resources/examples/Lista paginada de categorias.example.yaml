$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories?page=1&limit=10"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      description: Número da página
    - key: limit
      value: "10"
      description: Quantidade de itens por página
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": 1,
            "name": "Eletrônicos",
            "description": "Produtos eletrônicos variados",
            "slug": "eletronicos"
          }
        ],
        "pagination": {
          "page": 1,
          "totalPages": 5,
          "total": 47
        },
        "mensagens": [
          "Lista paginada de categorias"
        ]
      }
order: 1000
