$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Eletrônicos",
        "description": "Produtos eletrônicos variados"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Dados inválidos"
        ]
      }
order: 2000
