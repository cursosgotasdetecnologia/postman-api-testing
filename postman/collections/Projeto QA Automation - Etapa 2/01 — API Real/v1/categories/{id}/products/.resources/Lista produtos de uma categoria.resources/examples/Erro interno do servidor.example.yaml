$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories/:id/products"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      description: ID da categoria
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Erro interno ao buscar produtos da categoria."
        ]
      }
order: 5000
