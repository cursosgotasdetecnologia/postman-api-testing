$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories/12345"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Categoria não encontrada"
        ]
      }
order: 4000
