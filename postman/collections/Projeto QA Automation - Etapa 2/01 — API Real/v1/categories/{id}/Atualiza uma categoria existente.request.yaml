$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: "1"
body:
  type: json
  content: |-
    {
      "name": "Eletrônicos",
      "description": "Produtos eletrônicos variados"
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
settings: {}
examples: ./.resources/Atualiza uma categoria existente.resources/examples
order: 3000
