$kind: http-request
name: Realizar login com credenciais válidas
url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "{{projetoQAAutomationEmail}}",
      "password": "{{projetoQAAutomationPassword}}"
    }
scripts:
  - type: afterResponse
    code: "const resposta = pm.response.json(); \r

      pm.test(\"Login é realizado com sucesso\", function () {\r

      \     pm.response.to.have.status(200); }); \r

      \r

      \    pm.test(\"Resposta utiliza formato JSON\", function () { \r

      \        pm.expect( pm.response.headers.get(\"Content-Type\")
      ).to.include(\"application/json\"); \r

      \    }); \r

      \r

      \    pm.test(\"Login retorna token de acesso válido\", function () { \r

      \    pm.expect(resposta.data.token).to.be.a(\"string\").and.not.empty; });
      \r

      \r

      \    pm.test(\"Usuário autenticado apresenta informações principais\",
      function () { \r

      \        pm.expect(resposta.data.user).to.be.an(\"object\"); \r

      \        pm.expect(resposta.data.user).to.have.property(\"id\"); \r

      \        pm.expect(resposta.data.user).to.have.property(\"email\");\r

      \        pm.expect(resposta.data.user).to.have.property(\"role\"); }); if
      (resposta?.data?.token) { \r

      \        \r

      \    pm.environment.set( \"projetoQAAutomationAccessToken\",
      resposta.data.token ); }"
    language: text/javascript
settings: {}
examples: .resources/Realizar login com credenciais válidas-1.resources/examples
order: 1351
