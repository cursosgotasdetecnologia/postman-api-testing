$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{projetoQAAutomationEmail}}",
        "password": "{{projetoQAAutomationPassword}}"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Usuário inativo"
        ]
      }
order: 4000
