$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "administratrr@test.com",
        "password": "Test"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "E-mail ou senha inválidos."
        ]
      }
order: 3000
