$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{projetoQAAutomationEmail}}",
        "password": "{{projetoQAAutomationPassword}}"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Senha deve ter pelo menos 6 caracteres"
        ]
      }
order: 2000
