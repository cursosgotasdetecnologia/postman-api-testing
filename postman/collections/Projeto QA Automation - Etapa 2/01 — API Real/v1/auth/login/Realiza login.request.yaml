$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "{{projetoQAAutomationEmail}}",
      "password": "{{projetoQAAutomationPassword}}"
    }
settings: {}
examples: ./.resources/Realiza login.resources/examples
order: 1000
