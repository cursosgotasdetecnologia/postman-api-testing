$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "user": {
            "id": "00000000-0000-4000-8000-000000000001",
            "email": "aluno@example.com",
            "full_name": "Aluno Exemplo",
            "role": "customer"
          }
        },
        "mensagens": [
          "Operação realizada com sucesso."
        ]
      }
order: 1000
