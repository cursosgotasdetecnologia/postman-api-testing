$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/validate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "field": "email",
        "value": "aluno@example.com"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "valid": false
        },
        "mensagens": [
          "Campo não suportado para validação"
        ]
      }
order: 2000
