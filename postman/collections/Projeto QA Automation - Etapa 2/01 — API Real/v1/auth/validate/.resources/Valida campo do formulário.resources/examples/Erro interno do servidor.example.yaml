$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/validate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "field": "email",
        "value": "aluno@example.com"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "valid": false
        },
        "mensagens": [
          "Erro interno de validação"
        ]
      }
order: 3000
