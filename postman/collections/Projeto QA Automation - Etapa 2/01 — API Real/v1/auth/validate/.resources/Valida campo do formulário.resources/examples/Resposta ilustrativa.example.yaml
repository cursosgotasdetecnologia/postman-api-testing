$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/validate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "field": "email",
        "value": "aluno@example.com"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "valid": true
        },
        "mensagens": [
          "Email válido"
        ]
      }
order: 1000
