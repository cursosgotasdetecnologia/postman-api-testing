$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/cart/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "5121"
  body:
    type: json
    content: |-
      {
        "quantity": 1
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Acesso negado."
        ]
      }
order: 4000
