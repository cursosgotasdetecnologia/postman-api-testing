$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/cart"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_id": 1,
        "quantity": 2
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Estoque insuficiente. Disponível: 150"
        ]
      }
order: 3000
