$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/cart"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_id": 1,
        "quantity": 2
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": 1,
          "user_id": "00000000-0000-4000-8000-000000000001",
          "product_id": 1,
          "quantity": 2
        },
        "mensagens": [
          "Operação realizada com sucesso."
        ]
      }
order: 2000
