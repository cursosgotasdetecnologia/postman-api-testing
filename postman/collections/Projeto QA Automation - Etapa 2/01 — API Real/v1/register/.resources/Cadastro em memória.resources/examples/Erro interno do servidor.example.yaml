$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/register"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "aluno@example.com",
        "password": "Exemplo@123",
        "full_name": "Aluno Exemplo"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Internal server error"
        ]
      }
order: 3000
