$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/suppliers"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Erro ao carregar fornecedores."
        ]
      }
order: 3000
