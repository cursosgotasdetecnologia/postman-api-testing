$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/suppliers/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "5121"
      description: ID do fornecedor
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Fornecedor com ID 1 não encontrado."
        ]
      }
order: 4000
