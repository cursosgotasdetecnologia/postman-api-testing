$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/suppliers/:id/unlink"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "product_ids": [
          1
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "updated_count": 1,
          "updated_products": [
            {
              "id": 1,
              "name": "Mouse Gamer",
              "supplier_id": null
            }
          ],
          "supplier_id": 1
        },
        "mensagens": [
          "Operação realizada com sucesso."
        ]
      }
order: 1000
