$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/suppliers/:id/unlink"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "product_ids": [
          1
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Exemplo de erro retornado pela API"
        ]
      }
order: 5000
