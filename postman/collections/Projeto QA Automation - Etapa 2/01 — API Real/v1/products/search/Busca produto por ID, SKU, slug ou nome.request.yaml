$kind: http-request
description: Busca direta por um dos parâmetros. Pelo menos um é obrigatório. Se vários forem enviados, a prioridade é id, sku, slug e name. O nome deve ser completo e exato, incluindo maiúsculas e minúsculas; espaços nas extremidades são removidos.
url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/search?name=Mouse"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: id
    value: "1"
    disabled: true
    description: ID do produto
  - key: sku
    value: MGP-2024W
    disabled: true
    description: SKU exato do produto
  - key: slug
    value: mouse-gamer-rgb-pro-wireless
    disabled: true
    description: Slug exato do produto
  - key: name
    value: Mouse
    disabled: false
    description: Nome completo e exato do produto
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
settings: {}
examples: ./.resources/Busca produto por ID, SKU, slug ou nome.resources/examples
order: 1000
