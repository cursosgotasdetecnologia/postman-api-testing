$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/search?id=1&sku=MGP-2024W&slug=mouse-gamer-rgb-pro-wireless&name=Mouse Gamer RGB Pro Wireless"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: id
      value: "1"
      description: ID do produto
    - key: sku
      value: MGP-2024W
      description: SKU exato do produto
    - key: slug
      value: mouse-gamer-rgb-pro-wireless
      description: Slug exato do produto
    - key: name
      value: Mouse Gamer RGB Pro Wireless
      description: Nome completo e exato do produto
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Token ausente"
        ]
      }
order: 3000
