$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/simulate-error"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Erro interno simulado: falha na conexão com o serviço de processamento de dados."
        ]
      }
order: 2000
