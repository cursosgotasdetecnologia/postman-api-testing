$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/validate"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Mouse Gamer RGB",
        "price": 299.9,
        "stock_quantity": 50,
        "sku": "MGP-2024",
        "category_id": 1,
        "supplier_id": 1
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "valid": false,
          "errors": [
            "Erro interno na validação"
          ],
          "warnings": [],
          "suggestions": [
            "Tente novamente em instantes"
          ]
        },
        "mensagens": []
      }
order: 4000
