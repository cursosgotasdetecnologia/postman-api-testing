$kind: http-example
name: Nome/slug ou SKU duplicado
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "price": 259.9,
        "stock_quantity": 180
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Já existe outro produto com esse nome/slug."
        ]
      }
order: 5000
