$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/:id/pdf"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
        description: Arquivo PDF (máximo 2MB)
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "ID do produto inválido."
        ]
      }
order: 2000
