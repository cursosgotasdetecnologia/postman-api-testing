$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/:id/pdf"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "pdf-uuid-1234",
            "filename": "pdf-uuid-1234_manual_usuario.pdf",
            "url": "/api/v1/products/1/pdf/pdf-uuid-1234"
          }
        ],
        "mensagens": [
          "Lista de PDFs recuperada com sucesso."
        ]
      }
order: 1000
