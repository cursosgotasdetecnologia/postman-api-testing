$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/:id/image"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "f01afbb0-5c2a-4bac-9e8e-18877155de86",
            "filename": "f01afbb0-5c2a-4bac-9e8e-18877155de86_ChatGPT_Image.PNG",
            "url": "/api/v1/products/1/image/f01afbb0-5c2a-4bac-9e8e-18877155de86"
          }
        ],
        "mensagens": [
          "Lista de imagens recuperada com sucesso."
        ]
      }
order: 1000
