$kind: http-request
description: Faz upload de uma imagem PNG para o produto. Valida formato e tamanho (máx. 2MB).
url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/:id/image"
method: POST
headers:
  Content-Type: multipart/form-data
  Accept: application/json
pathVariables:
  id: "1"
body:
  type: formdata
  content:
    - type: file
      key: file
      src: ""
      description: Arquivo de imagem PNG (máximo 2MB)
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
settings: {}
examples: ./.resources/Upload de imagem PNG.resources/examples
order: 3000
