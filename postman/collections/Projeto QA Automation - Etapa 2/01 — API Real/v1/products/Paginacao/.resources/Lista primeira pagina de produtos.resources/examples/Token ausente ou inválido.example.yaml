$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products?page=1&limit=8&search=Gamer&category_id=1&supplier_id=2&sortBy=price&order=asc&is_active=true"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    page: "1"
    limit: "8"
    search: Gamer
    category_id: "1"
    supplier_id: "2"
    sortBy: price
    order: asc
    is_active: "true"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Token ausente"
        ]
      }
order: 3000
