$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products?page=1&limit=8&search=Gamer&category_id=1&supplier_id=2&sortBy=price&order=asc&is_active=true"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    page: "1"
    limit: "8"
    search: Gamer
    category_id: "1"
    supplier_id: "2"
    sortBy: price
    order: asc
    is_active: "true"
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [],
        "pagination": {
          "page": 1,
          "limit": 10,
          "total": 0,
          "totalPages": 0
        },
        "mensagens": [
          "Erro interno ao carregar produtos."
        ]
      }
order: 5000
