$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/products"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Teclado Mecânico Wireless",
      "price": 549.99,
      "stock_quantity": 37,
      "sku": "TCMW-2024B",
      "category_id": 1,
      "supplier_id": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
settings: {}
examples: ./.resources/Cria novo produto (US-08).resources/examples
order: 9000
