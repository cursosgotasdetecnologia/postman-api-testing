$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/reviews"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "rating": 5,
      "title": "Produto excelente!",
      "comment": "Chegou antes do prazo, qualidade top!"
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
settings: {}
examples: ./.resources/Cria nova avaliação.resources/examples
order: 3000
