$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/reviews"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_id": 1,
        "rating": 5,
        "title": "Produto excelente!",
        "comment": "Chegou antes do prazo, qualidade top!"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "A nota deve ser um número inteiro entre 1 e 5."
        ]
      }
order: 2000
