$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/reviews"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_id": 1,
        "rating": 5,
        "title": "Produto excelente!",
        "comment": "Chegou antes do prazo, qualidade top!"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": 1,
          "product_id": 1,
          "user_id": "00000000-0000-4000-8000-000000000001",
          "rating": 5,
          "title": "Excelente",
          "comment": "Produto conforme descrito",
          "is_approved": true
        },
        "mensagens": [
          "Operação realizada com sucesso."
        ]
      }
order: 1000
