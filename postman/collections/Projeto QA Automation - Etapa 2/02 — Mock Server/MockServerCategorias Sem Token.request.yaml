$kind: http-request
url: https://920e4531-a523-44ff-a667-57d13f04a5bb.mock.pstmn.io/api/v1/categories/2
method: GET
headers:
  x-mock-response-code: "401"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();

      pm.test("Deve retornar status 401 para requisição sem token", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Deve retornar Content-Type application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Deve retornar corpo como JSON válido", function () {
          pm.expect(jsonData).to.be.an("object");
      });

      pm.test("Deve retornar data como null", function () {
          pm.expect(jsonData.data).to.be.null;
      });

      pm.test("Deve retornar a propriedade expires_at como null", function () {
          pm.expect(jsonData).to.have.property("expires_at");
          pm.expect(jsonData.expires_at).to.be.null;
      });

      pm.test("Deve retornar mensagens como array", function () {
          pm.expect(jsonData.mensagens).to.be.an("array");
      });

      pm.test("Deve conter a mensagem de negócio esperada", function () {
          pm.expect(jsonData.mensagens).to.include("Exemplo de erro retornado pela API");
      });
    language: text/javascript
settings: {}
examples: ./.resources/MockServerCategorias Sem Token.resources/examples
order: 2000
