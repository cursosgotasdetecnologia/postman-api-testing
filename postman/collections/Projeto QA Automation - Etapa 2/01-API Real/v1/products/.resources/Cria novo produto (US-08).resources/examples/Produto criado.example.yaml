$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Teclado Mecânico Wireless",
        "price": 549.99,
        "stock_quantity": 37,
        "sku": "TCMW-2024B",
        "category_id": 1,
        "supplier_id": 1
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": 95,
          "name": "Teclado Mecânico Wireless",
          "slug": "teclado-mecanico-wireless",
          "price": 549.99,
          "stock_quantity": 37,
          "sku": "TCMW-2024B",
          "category_id": 1,
          "supplier_id": 1,
          "is_active": true
        },
        "mensagens": [
          "Produto criado com sucesso!",
          "Verificado: Salvo no banco Supabase (qvbbrcvqjssrbrcspwtu.supabase.co)"
        ]
      }
order: 1000
