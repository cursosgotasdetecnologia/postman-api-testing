$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "name": "Teclado Mecânico Wireless",
        "price": 549.99,
        "stock_quantity": 37,
        "sku": "TCMW-2024B",
        "category_id": 1,
        "supplier_id": 1
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Token ausente"
        ]
      }
order: 3000
