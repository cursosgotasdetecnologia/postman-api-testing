$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/register"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "full_name": "Maria Silva Santos",
        "email": "maria.silva@exemplo.com.br",
        "password": "SenhaForte@2024",
        "confirmPassword": "SenhaForte@2024"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Já existe um usuário com esse e-mail."
        ]
      }
order: 3000
