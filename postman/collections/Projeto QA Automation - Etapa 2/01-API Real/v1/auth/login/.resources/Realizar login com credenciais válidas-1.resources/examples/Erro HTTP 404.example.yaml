$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{projetoQAAutomationEmail}}",
        "password": "{{projetoQAAutomationPassword}}"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Usuário não encontrado. Verifique o email ou cadastre-se."
        ]
      }
order: 5000
