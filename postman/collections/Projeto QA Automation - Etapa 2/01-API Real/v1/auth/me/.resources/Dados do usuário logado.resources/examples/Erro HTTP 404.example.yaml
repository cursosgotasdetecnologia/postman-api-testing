$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Usuário não encontrado"
        ]
      }
order: 3000
