$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories?page=1&limit=10"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      description: Número da página
    - key: limit
      value: "10"
      description: Quantidade de itens por página
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Exemplo de erro retornado pela API"
        ]
      }
order: 3000
