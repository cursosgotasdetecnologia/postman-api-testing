$kind: http-example
request:
  url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "name": "Eletrônicos",
        "description": "Produtos eletrônicos variados"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "mensagens": [
          "Categoria não encontrada"
        ]
      }
order: 4000
