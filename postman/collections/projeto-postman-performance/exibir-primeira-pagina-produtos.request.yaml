$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/products?page=1&limit=5"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "5"
  - key: search
    value: Gamer
    disabled: true
  - key: category_id
    value: "1"
    disabled: true
  - key: supplier_id
    value: "2"
    disabled: true
  - key: sortBy
    value: price
    disabled: true
  - key: order
    value: asc
    disabled: true
  - key: is_active
    value: "true"
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
scripts:
  - type: afterResponse
    code: "const resposta = pm.response.json(); \r

      \r

      pm.test(\"Resposta retorna status HTTP 200\", function () { \r

      \    pm.response.to.have.status(200); }); \r

      pm.test(\"Consulta retorna a primeira página solicitada\", function () { \r

      \    pm.expect(resposta.pagination.page).to.eql(1); });\r

      \r

      \r

      const respostaProdutos = pm.response.json(); \r

      \r

      const primeiroProduto = respostaProdutos.data[0];\r

      \r

      \ pm.test(\"Primeiro produto fornece os identificadores necessários\", function () { \r

      \    pm.expect(primeiroProduto).to.be.an(\"object\"); \r

      \    pm.expect(primeiroProduto.id).to.exist; \r

      \    pm.expect(primeiroProduto.category_id).to.exist; \r

      \    pm.expect(primeiroProduto.supplier_id).to.exist; }); \r

      \    \r

      \    pm.environment.set( \"projetoQAAutomationProductId\", primeiroProduto.id );\r

      \    \r

      \    pm.environment.set( \"projetoQAAutomationCategoryId\", primeiroProduto.category_id ); \r

      \     \r

      \    pm.environment.set( \"projetoQAAutomationSupplierId\", primeiroProduto.supplier_id );    \r

      \r

      \r

      \ "
    language: text/javascript
order: 2000
