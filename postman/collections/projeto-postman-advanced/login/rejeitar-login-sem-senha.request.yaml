$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "usuriao@gmail.com.br" 
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
scripts:
  - type: afterResponse
    code: "const resposta = pm.response.json(); \r

      \r

      pm.test(\"Credenciais inválidas são rejeitadas\", function () { \r

      \    pm.response.to.have.status(400); }); \r

      \    \r

      pm.test(\"Resposta de erro utiliza formato JSON\", function () {   \r

      \    pm.expect( pm.response.headers.get(\"Content-Type\") ).to.include(\"application/json\"); }); \r

      \r

      pm.test(\"Resposta apresenta mensagem de autenticação\", function () { \r

      \   pm.expect(resposta.mensagens).to.be.an(\"array\").and.not.empty;\r

      \r

      });\r

      \r

      const respostaLoginSemSenha = pm.response.json(); \r

      \r

      pm.test(\"Login sem senha é rejeitado\", function () { \r

      \    pm.response.to.have.status(400); }); //400\r

      \r

      pm.test(\"Erro de validação utiliza formato JSON\", function () { \r

      \   pm.expect( pm.response.headers.get(\"Content-Type\") ).to.include(\"application/json\"); }); \r

      \r

      pm.test(\"Resposta não retorna dados de autenticação\", function () { \r

      \    pm.expect(respostaLoginSemSenha.data).to.be.null; }); \r

      \r

      pm.test(\"Resposta apresenta mensagens de validação\", function () {\r

      \    pm.expect(respostaLoginSemSenha.mensagens) .to.be.an(\"array\") .that.is.not.empty; }); \r

      \r

      pm.test(\"Mensagem informa que email e senha são obrigatórios\", function () {\r

      \    pm.expect( respostaLoginSemSenha.mensagens.join(\" \") ).to.include(\"Email e senha são obrigatórios\"); });"
    language: text/javascript
settings: {}
examples: .resources/rejeitar-login-sem-senha.resources/examples
order: 2042
