$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "{{projetoQAAutomationEmail}}",
      "password": "{{projetoQAAutomationPassword}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
scripts:
  - type: afterResponse
    code: "// @allure.label.severity=critical\r

      \r

      const resposta = pm.response.json(); \r

      pm.test(\"Login é realizado com sucesso\", function () {\r

      \     pm.response.to.have.status(200); }); \r

      \r

      \    pm.test(\"Resposta utiliza formato JSON\", function () { \r

      \        pm.expect( pm.response.headers.get(\"Content-Type\") ).to.include(\"application/json\"); \r

      \    }); \r

      \r

      \    pm.test.skip(\"[DEMO]Login retorna token de acesso válido\", function () { \r

      \    pm.expect(resposta.data.token).to.be.a(\"string\").and.not.empty; }); \r

      \r

      \    pm.test(\"Usuário autenticado apresenta informações principais\", function () { \r

      \        pm.expect(resposta.data.user).to.be.an(\"object\"); \r

      \        pm.expect(resposta.data.user).to.have.property(\"id\"); \r

      \        pm.expect(resposta.data.user).to.have.property(\"email\");\r

      \        pm.expect(resposta.data.user).to.have.property(\"role\"); });\r

      \r

      \ if (resposta?.data?.token) {       \r

      \    pm.environment.set( \"projetoQAAutomationAccessToken\", resposta.data.token ); }\r

      \r

      \    \r

      \r

      pm.test(\"[DEMO] Status HTTP esperado para validação controlada\", function () {\r

      \    pm.expect(pm.response.code).to.eql(201);\r

      });\r

      \r

      pm.test(\"[DEMO] Tempo de resposta esperado para validação controlada\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(1);\r

      });\r

      \r

      pm.test(\"[DEMO] Header demonstrativo deve estar presente\", function () {\r

      \    pm.expect(pm.response.headers.has(\"X-Demo-Test\")).to.be.true;\r

      });\r

      \r

      pm.test(\"[DEMO] Resposta deve apresentar propriedade demonstrativa\", function () {\r

      \    const respostaDemo = pm.response.json();\r

      \    pm.expect(respostaDemo).to.have.property(\"propriedade_demo\");\r

      });"
    language: text/javascript
order: 1000
