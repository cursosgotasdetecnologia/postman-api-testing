$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/categories?page=1&limit=5"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    description: Número da página
  - key: limit
    value: "5"
    description: Quantidade de itens por página
auth:
  type: bearer
  credentials:
    token: teste
scripts:
  - type: afterResponse
    code: "const respostaTokenInvalido = pm.response.json();\r

      \r

      pm.test(\"Token inválido retorna HTTP 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Token inválido não libera os dados protegidos\", function () {\r

      \    pm.expect(respostaTokenInvalido.data).to.be.null;\r

      });\r

      \r

      pm.test(\"Resposta apresenta mensagem de token inválido\", function () {\r

      \    pm.expect(respostaTokenInvalido.mensagens)\r

      \        .to.be.an(\"array\")\r

      \        .that.is.not.empty;\r

      });"
    language: text/javascript
order: 4000
