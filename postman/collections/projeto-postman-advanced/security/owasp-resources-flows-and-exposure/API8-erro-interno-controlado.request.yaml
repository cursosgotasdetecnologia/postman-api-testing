  - type: afterResponse
    code: "const respostaAPI8 = pm.response.json();\r

      const conteudoAPI8 = JSON.stringify(respostaAPI8).toLowerCase();\r

      \r

      pm.test(\"Erro interno simulado retorna status 500\", function () {\r

      \    pm.response.to.have.status(500);\r

      });\r

      \r

      pm.test(\"Erro interno não retorna dados\", function () {\r

      \    pm.expect(respostaAPI8.data).to.be.null;\r

      });\r

      \r

      pm.test(\"Erro apresenta uma mensagem controlada\", function () {\r

      \    pm.expect(respostaAPI8.mensagens)\r

      \        .to.be.an(\"array\")\r

      \        .that.is.not.empty;\r

      });\r

      \r

      pm.test(\"Resposta não expõe informações internas sensíveis\", function () {\r

      \    const termosSensiveis = [\r

      \        \"stacktrace\",\r

      \        \"exception\",\r

      \        \"select *\",\r

      \        \"insert into\",\r

      \        \"supabase\",\r

      \        \"service_role\",\r

      \        \"jwt_secret\",\r

      \        \"database_url\",\r

      \        \"password\"\r

      \    ];\r

      \r

      \    const termosEncontrados = termosSensiveis.filter(function (termo) {\r

      \        return conteudoAPI8.includes(termo);\r

      \    });\r

      \r

      \    pm.expect(termosEncontrados).to.be.empty;\r

      });"
