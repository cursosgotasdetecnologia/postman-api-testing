$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/products?page=2&limit=5"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "2"
  - key: limit
    value: "5"
  - key: search
    value: Gamer
    disabled: true
  - key: category_id
    value: "1"
    disabled: true
  - key: supplier_id
    value: "2"
    disabled: true
  - key: sortBy
    value: price
    disabled: true
  - key: order
    value: asc
    disabled: true
  - key: is_active
    value: "true"
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
scripts:
  - type: afterResponse
    code: "const resposta = pm.response.json(); \r

      \r

      pm.test(\"Resposta retorna status HTTP 200\", function () { \r

      \    pm.response.to.have.status(200); }); \r

      pm.test.skip(\"[DEMO]Consulta retorna a segunda página solicitada\", function () { \r

      \    pm.expect(resposta.pagination.page).to.eql(2); });"
    language: text/javascript
order: 2000
