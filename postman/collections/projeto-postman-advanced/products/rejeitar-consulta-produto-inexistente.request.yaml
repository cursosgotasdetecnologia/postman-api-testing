$kind: http-request
url: "{{projetoQAAutomationBaseUrl}}/api/v1/products/9999999"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{projetoQAAutomationAccessToken}}"
scripts:
  - type: afterResponse
    code: "const respostaProdutoInexistente = pm.response.json(); \r

      \r

      pm.test(\"Produto inexistente retorna HTTP 404\", function () { \r

      \    pm.response.to.have.status(404); }); \r

      pm.test(\"Erro de produto inexistente utiliza JSON\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\"); }); \r

      \r

      pm.test.skip(\"[DEMO] Produto inexistente não retorna dados\", function () { \r

      \    pm.expect(respostaProdutoInexistente.data).to.be.null; }); \r

      \r

      pm.test(\"Resposta apresenta mensagem de erro\", function () { \r

      \    pm.expect(respostaProdutoInexistente.mensagens).to.be.an(\"array\").that.is.not.empty; }); \r

      \r

      pm.test(\"Mensagem informa que o produto não foi encontrado\", function () { \r

      \    pm.expect(respostaProdutoInexistente.mensagens.join(\" \").toLowerCase()).to.include(\"não encontrado\"); });"
    language: text/javascript
order: 3000
