name: Testes de API com Postman CLI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'postman/**'
      - '.github/workflows/**'

jobs:
  testes-api:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Executar testes com Postman CLI
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >-
            collection run postman/collections/projeto-postman-advanced
            --environment postman/environments/projeto-postman-advanced-env.environment.yaml
            --env-var projetoQAAutomationBaseUrl=${{ vars.API_BASE_URL }}
            --env-var projetoQAAutomationEmail=${{ secrets.API_TEST_EMAIL }}
            --env-var projetoQAAutomationPassword=${{ secrets.API_TEST_PASSWORD }}